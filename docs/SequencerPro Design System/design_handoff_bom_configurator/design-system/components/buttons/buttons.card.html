<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  .lbl { font-size: var(--text-2xs); font-weight: var(--fw-bold); letter-spacing: var(--ls-caps);
         text-transform: uppercase; color: var(--text-muted); width: 64px; flex: none; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton } = window.SequencerProDesignSystem_5eb90b;
  function Demo() {
    return (
      <div>
        <div className="row">
          <span className="lbl">Variant</span>
          <Button variant="primary">Save process</Button>
          <Button variant="accent" iconLeft={<i className="bi bi-plus-lg" />}>New job</Button>
          <Button variant="secondary">Cancel</Button>
          <Button variant="ghost">Discard</Button>
          <Button variant="danger">Delete</Button>
          <Button variant="dark">Validate</Button>
        </div>
        <div className="row">
          <span className="lbl">Size</span>
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div className="row">
          <span className="lbl">Icon</span>
          <IconButton title="Edit" variant="secondary"><i className="bi bi-pencil" /></IconButton>
          <IconButton title="Duplicate" variant="ghost"><i className="bi bi-copy" /></IconButton>
          <IconButton title="Delete" variant="ghost"><i className="bi bi-trash" /></IconButton>
          <IconButton title="Add" variant="primary"><i className="bi bi-plus-lg" /></IconButton>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
