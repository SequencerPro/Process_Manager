<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 640px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Field, Input, Select } = window.SequencerProDesignSystem_5eb90b;
  function Demo() {
    return (
      <div className="grid">
        <Field label="Part number" required hint="Format: WDG-000">
          <Input mono placeholder="WDG-100" />
        </Field>
        <Field label="Step pattern">
          <Select defaultValue="Transform">
            <option>Transform</option><option>Assembly</option>
            <option>Division</option><option>General</option>
          </Select>
        </Field>
        <Field label="Search">
          <Input prefix={<i className="bi bi-search" />} placeholder="Find a job…" />
        </Field>
        <Field label="Nominal value">
          <Input mono defaultValue="1200" suffix="RPM" />
        </Field>
        <Field label="Upper tolerance" error="Must be ≥ nominal">
          <Input invalid mono defaultValue="-50" suffix="mm" />
        </Field>
        <Field label="Disabled">
          <Input disabled placeholder="Read only" />
        </Field>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
