<!-- @dsCard group="Components" viewport="700x360" name="Cards, KPIs & ports" subtitle="Surfaces, metric tiles and typed port chips" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .wrap { display: grid; grid-template-columns: 200px 200px 1fr; gap: 16px; align-items: start; }
  .kpis { display: grid; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, StatCard, PortBadge, StatusBadge, Tag } = window.SequencerProDesignSystem_5eb90b;
  function Demo() {
    return (
      <div className="wrap">
        <div className="kpis">
          <StatCard label="Active jobs" value="12" delta="+3 wk" deltaTone="up" icon={<i className="bi bi-briefcase" />} />
          <StatCard label="Yield" value="96.4" unit="%" delta="-0.8 pt" deltaTone="down" accent="var(--teal)" icon={<i className="bi bi-check2-circle" />} />
        </div>
        <div className="kpis">
          <StatCard label="WIP units" value="148" accent="var(--blue)" icon={<i className="bi bi-box-seam" />} />
          <StatCard label="On hold" value="3" accent="var(--orange)" icon={<i className="bi bi-pause-circle" />} />
        </div>
        <Card title="CNC Machining" subtitle="MACH-01 · Transform · v2"
              accent="var(--blue)"
              actions={<StatusBadge tone="active" />}>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
            <PortBadge type="Material" direction="in" label="Raw widget" />
            <PortBadge type="Parameter" direction="in" label="Spindle RPM" />
            <PortBadge type="Condition" direction="in" label="Tool offset OK" />
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            <PortBadge type="Material" direction="out" label="Machined widget" />
            <PortBadge type="Characteristic" direction="out" label="Hole Ø" />
          </div>
          <div style={{ marginTop: 14, display: "flex", gap: 8 }}>
            <Tag color="blue">WDG-100</Tag><Tag color="teal">Grade A</Tag>
          </div>
        </Card>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
