  html, body { margin: 0; height: 100%; background: var(--bg-app); font-family: var(--font-sans); }

<script>
  (function mount() {
    var w = window;
    if (w.BomApp && w.CFG && w.CAR && w.ConfigureView && w.AuthorView && w.SchematicRobot && w.ProductTree && w.ProductPreview && w.PreviewAuthor && w.PreviewStore && w.BomTree && w.SequencerProDesignSystem_5eb90b) {

      w.__bomRoot.render(React.createElement(w.BomApp));
    } else { setTimeout(mount, 40); }
  })();
</script>
